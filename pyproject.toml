[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-finance-controller"
version = "0.1.0"
description = "Closes one finance-ops loop: reconciles ledger/settlement/bank, posts the journal entries, and reports the cash position."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "psycopg[binary]>=3.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "mypy>=1.9",
]
# Gate 11 only. Deliberately NOT a base dependency: gates 0-10 must run, and the
# --no-llm path must keep running, with no LLM client installed at all (§4.4).
llm = [
    "anthropic>=0.34",
]

[tool.setuptools]
packages = [
    "core",
    "ingest",
    "matching",
    "adjudication",
    "posting",
    "exceptions_",
    "pipeline",
    "api",
    "api.routes",
    "persistence",
    "generator",
    "generator.injectors",
    "eval",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "TRY", "RUF"]
# E722 (bare except) is in E and stays ON. A swallowed exception in a
# reconciliation system is how money disappears (§5.5).
# RUF001 (ambiguous chars in string literals) stays ON — that is a real parsing
# bug class. RUF002/RUF003 flag the same characters in docstrings and comments,
# where an em dash or a minus sign is correct prose, not a defect.
ignore = ["TRY003", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# core/ and matching/ are where money bugs live (§9.7) — no escape hatches there.
