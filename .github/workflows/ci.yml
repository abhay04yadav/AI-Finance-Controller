name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Guide §3.2 — the dependency rule is enforced, not aspirational.
      - name: Layering check
        run: python scripts/check_layering.py

      # Review Guide part 3 — the six standing checks.
      - name: Drift check
        run: python scripts/drift_check.py

      - name: Lint
        run: python -m ruff check .

      - name: Tests
        run: python -m pytest tests/ -v

      # Gate 3 onward: a precision drop must fail the build (§7.5).
      # Enabled once the generator and eval harness exist.
      # - name: Eval regression gate
      #   run: make eval SEED=42 SCALE=500 NO_LLM=1
